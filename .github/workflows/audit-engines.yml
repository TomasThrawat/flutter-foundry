name: Audit Engine Scans\n\non:\n  pull_request:\n    branches: [main]\n  workflow_dispatch:\n    inputs:\n      target_repository:\n        description: Public repository to scan (owner/repository)\n        required: true\n        type: string\n        default: TomasThrawat/flutter-foundry\n      target_ref:\n        description: Branch, tag, or commit to scan\n        required: true\n        type: string\n        default: main\n      engine:\n        description: Scanner to run\n        required: true\n        type: choice\n        options: [all, trivy, gitleaks, semgrep, osv-scanner, zizmor, ruff, shellcheck, biome]\n        default: all\n\npermissions:\n  contents: read\nconcurrency:\n  group: audit-${{ github.event.pull_request.number || inputs.target_repository || github.repository }}\n  cancel-in-progress: false\njobs:\n  scan:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    permissions:\n      contents: read\n    env:\n      TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.target_repository || github.event.pull_request.head.repo.full_name || github.repository }}\n      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.event.pull_request.head.sha || github.sha }}\n      AUDIT_ENGINE: ${{ github.event_name == 'workflow_dispatch' && inputs.engine || 'all' }}\n    steps:\n      - name: Check out trusted scanner code\n        uses: actions/checkout@v4\n        with:\n          repository: ${{ github.repository }}\n          ref: ${{ github.event.pull_request.base.sha || github.sha }}\n          path: tooling\n          persist-credentials: false\n      - name: Check trusted scanner availability\n        id: scanner\n        shell: bash\n        run: |\n          if [[ -f tooling/.github/scripts/run-audit.sh ]]; then\n            echo "available=true" >> "$GITHUB_OUTPUT"\n          else\n            echo "available=false" >> "$GITHUB_OUTPUT"\n            echo "Trusted scanner code is not yet present on the base branch. The audit will run for later PRs after this PR is merged." >> "$GITHUB_STEP_SUMMARY"\n          fi\n      - name: Validate target repository and reference\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$ ]] || [[ "$TARGET_REPOSITORY" == *".."* ]]; then\n            echo "Invalid repository. Expected owner/repository."\n            exit 1\n          fi\n          if [[ ! "$TARGET_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]] || [[ "$TARGET_REF" == *".."* ]] || [[ "$TARGET_REF" == *"//"* ]] || [[ "$TARGET_REF" == */ ]] || [[ "$TARGET_REF" == *".lock" ]]; then\n            echo "Invalid target ref."\n            exit 1\n          fi\n          visibility="$(curl --fail --silent --show-error "https://api.github.com/repos/$TARGET_REPOSITORY" | jq -r '.visibility')"\n          if [[ "$visibility" != "public" ]]; then\n            echo "Only public repositories can be scanned by this workflow."\n            exit 1\n          fi\n          echo "Scanning public repository: $TARGET_REPOSITORY@$TARGET_REF"\n          echo "Requested engine: $AUDIT_ENGINE"\n      - name: Check out target source without credentials\n        if: ${{ steps.scanner.outputs.available == 'true' }}\n        uses: actions/checkout@v4\n        with:\n          repository: ${{ env.TARGET_REPOSITORY }}\n          ref: ${{ env.TARGET_REF }}\n          path: target\n          persist-credentials: false\n      - name: Run selected scanners\n        if: ${{ steps.scanner.outputs.available == 'true' }}\n        shell: bash\n        run: bash tooling/.github/scripts/run-audit.sh target\n        env:\n          AUDIT_ENGINE: ${{ env.AUDIT_ENGINE }}\n      - name: Upload audit reports\n        if: always() && steps.scanner.outputs.available == 'true'\n        uses: actions/upload-artifact@v4\n        with:\n          name: audit-report-${{ github.run_id }}\n          path: ${{ runner.temp }}/flutter-foundry-audit-reports/\n          if-no-files-found: warn\n          retention-days: 7\n