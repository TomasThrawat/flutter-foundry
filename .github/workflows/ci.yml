name: Flutter Foundry CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: flutter-foundry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      - name: Install scanner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl tar gzip python3
      - name: Install and run Trivy, Gitleaks, Semgrep, and OSV-Scanner
        run: bash .github/scripts/security-scan.sh

  checks:
    needs: security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      - name: Install dependencies (known npm peer-resolution quirk)
        run: npm ci --legacy-peer-deps --cache "$RUNNER_TEMP/npm-cache"
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - name: Validate audit runner shell syntax
        run: bash -n .github/scripts/run-audit.sh .github/scripts/security-scan.sh
      - run: npm test
      - name: Measure icon pipeline test coverage
        run: npm run test:icons:coverage
      - name: Measure full library coverage
        run: npm run test:coverage
      - run: npm run lint
      - run: npm run build

  svg-edit-browser:
    needs: security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      - name: Install dependencies (known npm peer-resolution quirk)
        run: npm ci --legacy-peer-deps --cache "$RUNNER_TEMP/npm-cache"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:svg-edit
