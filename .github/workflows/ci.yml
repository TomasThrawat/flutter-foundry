name: Flutter Foundry CI\non:\n  push:\n    branches: [main]\n  pull_request:\n  workflow_dispatch:\npermissions:\n  contents: read\nconcurrency:\n  group: flutter-foundry-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\njobs:\n  checks:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2\n      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0\n        with:\n          node-version: 22\n      - run: npm install\n      - name: Audit dependencies\n        run: npm audit --audit-level=moderate\n      - run: npm run typecheck\n      - name: Validate audit runner shell syntax\n        run: bash -n .github/scripts/run-audit.sh\n      - run: npm test\n      - run: npm run lint\n      - run: npm run build\n  svg-edit-browser:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2\n      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0\n        with:\n          node-version: 22\n      - run: npm install\n      - run: npx playwright install --with-deps chromium\n      - run: npm run test:svg-edit\n