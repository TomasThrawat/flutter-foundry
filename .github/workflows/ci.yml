name: Flutter Foundry CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-foundry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
      - name: Install scanner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl tar gzip python3 python3-venv
      - name: Install and run Trivy, Gitleaks, Semgrep, and OSV-Scanner
        run: bash .circleci/security-scan.sh

  checks:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
      - run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - name: Validate audit runner shell syntax
        run: bash -n .github/scripts/run-audit.sh .circleci/security-scan.sh
      - run: npm test
      - run: npm run lint
      - run: npm run build

  svg-edit-browser:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:svg-edit
